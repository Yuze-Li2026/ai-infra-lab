name: CS336 original CPU environments
on:
  workflow_dispatch:
  push:
    branches: [codex/quality-and-ui]
    paths:
      - .github/workflows/cs336-cpu.yml
      - scripts/check-cs336-environment.py
      - scripts/project.py
      - scripts/processes.py
      - labs/projects.json
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [a1, a2]
    env:
      UV_NO_CACHE: '1'
      UV_NO_MANAGED_PYTHON: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare the fixed upstream starter and package manager
        run: |
          python scripts/project.py systems prepare --part ${{ matrix.part }}
          python -m pip install uv==0.11.20
      - name: Install exactly the upstream lock in its independent environment
        working-directory: workspaces/systems-${{ matrix.part }}
        run: uv sync --frozen --python 3.12
      - name: Execute all collected original tests without filling assignment answers
        run: python scripts/check-cs336-environment.py --part ${{ matrix.part }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cs336-${{ matrix.part }}-cpu-evidence
          path: artifacts/course-cs336-${{ matrix.part }}*
          retention-days: 7
          if-no-files-found: error
