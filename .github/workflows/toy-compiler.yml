name: MLIR Toy original CPU environment
on:
  workflow_dispatch:
  push:
    branches: [codex/quality-and-ui]
    paths:
      - .github/workflows/toy-compiler.yml
      - scripts/check-toy-environment.py
      - labs/compiler-validation/toy-version.json
permissions:
  contents: read
jobs:
  toy:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the seven pinned chapters and execute every original test
        run: python scripts/check-toy-environment.py --run --jobs 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: toy-cpu-evidence
          path: |
            artifacts/toy-results.json
            artifacts/toy-lit-results.json
            artifacts/toy-collection.txt
            artifacts/toy-build.log
          retention-days: 7
          if-no-files-found: error
