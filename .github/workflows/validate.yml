name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r labs/requirements-cpu.txt
      - run: npm run check
      - run: python labs/object-model/run.py --benchmark
      - run: python labs/dbdb/run.py
      - run: python labs/consensus/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-reports-${{ matrix.os }}
          path: artifacts/*-report.json
