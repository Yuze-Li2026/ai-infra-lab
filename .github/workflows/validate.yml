name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r labs/requirements-ci.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0+cpu
      - run: npm run check
      - run: python labs/object-model/run.py --benchmark
      - run: python labs/dbdb/run.py
      - run: python labs/consensus/run.py
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lab-reports-${{ matrix.os }}
          path: |
            artifacts/*-report.json
            artifacts/*-results.json
            artifacts/*browser*.log
          retention-days: 7
          if-no-files-found: error
